name: rigcanvas
description: Cross-platform guitar rig editor and KPT Pro research workspace.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.3
  material_ui: ^1.11.0
  path_provider: ^2.1.6
  rigcanvas_dsp:
    path: packages/rigcanvas_dsp
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
