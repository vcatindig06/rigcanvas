name: Flutter CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Generate Android and Windows runners
        run: flutter create --project-name rigcanvas --org com.rigcanvas --platforms=android,windows .

      - name: Configure Android BLE permissions and minimum SDK
        run: dart run tool/prepare_platforms.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Format source
        run: dart format lib test tool

      - name: Apply supported Dart fixes
        run: dart fix --apply

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  build-android:
    name: Build Android installable mobile APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create --project-name rigcanvas --org com.rigcanvas --platforms=android .

      - name: Configure Android BLE permissions and minimum SDK
        run: dart run tool/prepare_platforms.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Build installable Android APK
        run: flutter build apk --debug

      - name: Verify Android package and create checksum
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK_PATH"
          sha256sum "$APK_PATH" > "$APK_PATH.sha256"

      - name: Upload mobile app package
        uses: actions/upload-artifact@v4
        with:
          name: rigcanvas-mobile-android-apk
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows desktop
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Generate Windows runner
        run: flutter create --project-name rigcanvas --org com.rigcanvas --platforms=windows .

      - name: Resolve packages
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: rigcanvas-windows-release
          path: app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
